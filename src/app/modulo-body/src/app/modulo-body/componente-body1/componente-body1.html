<div class="flex  w-full">
    <div class="flex flex-col items-center w-2/6 p-4" *ngFor="let a of categorias | keyvalue">
        <div class="mt-10 ">
            <h1 class="font-bold text-2xl mb-4">{{a.key}}</h1>
            <div class="flex flex-col bg-gray-200 w-72  p-6 pl-8">
                <a class="border-l-3 pt-2 pb-2 pl-4 cursor-pointer -tracking-tight" *ngFor="let b of a.value" (click)="seleccionar(b)"
                    [ngClass]="{'text-[#1c3f3a] border-[#1c3f3a] font-bold': seleccionado === b,
                    'text-gray-500 border-gray-300': seleccionado !== b
                }">{{b}}</a>
            </div>
        </div>
    </div>

    <div class="flex flex-2 flex-col w-4/6  pr-12">
        <h1 class="font-bold text-2xl mt-10 mb-[-24px]">All Articles</h1>
        <div class="mt-10 w-full grid grid-cols-2 gap-8">
            <div class="w-full h-auto " *ngFor="let a of cardsbody">

                <div class="w-full h-60 "><img [src]="a.imagen" class="w-full h-full"></div>
                <div class="flex items-center w-full h-10 ">
                    <p class="text-[#1c3f3a] ">{{a.subtitle}}</p>
                </div>
                <div class="w-full h-20">
                    <p class="font-medium text-xl">{{a.content}}</p>
                </div>
                <div class="flex items-center w-full h-10 mt-[-16px]">
                    <p class="underline font-bold">{{a.autor}}</p>
                    <p class="ml-2 text-gray-500"> ● {{a.fecha}}</p>
                </div>
            </div>
        </div>
    </div>
</div>
